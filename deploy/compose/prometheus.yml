global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: router
    static_configs:
      - targets: [host.docker.internal:8080]
  - job_name: vllm
    static_configs:
      - targets: [vllm:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
